import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.31.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.5.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    // JUnit 5 dependencies for public test-writing API, and test engine, respectively.
    testImplementation('org.junit.jupiter:junit-jupiter:5.6.0')
    testImplementation('org.junit.platform:junit-platform-launcher:1.5.2')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.5.1')
}

test {
    // Tells the 'test' task to enable JUnit 5 support
    useJUnitPlatform()
}

javadoc {
    title = 'mParticle Firehose Java SDK Reference'
    failOnError false
    getOptions().setNoTimestamp(true)
}

def releaseVersion = findProperty('VERSION')?.toString()?.trim() ?: rootProject.file('VERSION').text.trim()
// Signing keys only exist in the release workflows; local and smoke-test publishes stay unsigned.
def shouldSign = findProperty('signingInMemoryKey')?.toString()?.trim()

mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), true))
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    if (shouldSign) {
        signAllPublications()
    }

    coordinates('com.mparticle', 'java-sdk', releaseVersion)

    pom {
        name = 'mParticle Java SDK'
        description = 'mParticle Java SDK used to integrate with mParticle\'s Firehose API'
        url = 'https://github.com/mParticle/mparticle-firehose-java-sdk'
        licenses {
            license {
                name = 'The Apache Software License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'mParticle'
                name = 'mParticle Inc.'
                email = 'developers@mparticle.com'
            }
        }
        scm {
            url = 'https://github.com/mParticle/mparticle-firehose-java-sdk'
            connection = 'scm:git:https://github.com/mParticle/mparticle-firehose-java-sdk'
            developerConnection = 'scm:git:git@github.com:mParticle/mparticle-firehose-java-sdk.git'
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
